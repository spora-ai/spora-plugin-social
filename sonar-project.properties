sonar.projectKey=spora-ai_spora-plugin-social
sonar.organization=spora-ai
sonar.projectName=spora-plugin-social
sonar.projectVersion=0.1.0
sonar.sources=src
sonar.tests=tests
sonar.exclusions=vendor/**,storage/**
sonar.php.coverage.reportPaths=coverage.xml
sonar.sourceEncoding=UTF-8

# Block the CI job until the gate is evaluated. The org's gate has a
# `new_coverage` condition, and a scan that does not wait leaves it unmeasured.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
