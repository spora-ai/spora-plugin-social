name: CI

# External actions are pinned to full commit SHAs to prevent supply-chain
# attacks via tag reassignment. Run `gh api repos/OWNER/REPO/git/refs/tags/vN`
# to look up the current SHA when upgrading.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Pest (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - name: Checkout plugin
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, mbstring, gd
          coverage: none
          tools: composer

      - name: Composer update spora-core
        run: composer update spora-ai/spora-core --with-all-dependencies --no-interaction --prefer-dist

      - name: Run Pest
        # The live suite needs credentials and the network, so it is not part of CI.
        run: ./vendor/bin/pest --parallel --processes=auto --max-batch-size=50 --exclude-testsuite=Live

  static-analysis:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout plugin
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer

      - name: Composer update spora-core
        run: composer update spora-ai/spora-core --with-all-dependencies --no-interaction --prefer-dist

      - name: Run PHPStan
        run: ./vendor/bin/phpstan analyse --no-progress --memory-limit=512M

  code-style:
    name: php-cs-fixer (dry-run)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout plugin
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer

      - name: Composer update spora-core
        run: composer update spora-ai/spora-core --with-all-dependencies --no-interaction --prefer-dist

      - name: Check code style
        # Same ruleset as spora-core's .php-cs-fixer.php so plugin style matches host.
        run: ./vendor/bin/php-cs-fixer fix --dry-run --diff --no-interaction

  coverage:
    name: Coverage (clover)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout plugin
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.4'
          extensions: curl, mbstring, gd
          coverage: xdebug
          tools: composer

      - name: Composer update spora-core
        run: composer update spora-ai/spora-core --with-all-dependencies --no-interaction --prefer-dist

      - name: Run Pest with coverage
        run: XDEBUG_MODE=coverage ./vendor/bin/pest --coverage-clover=coverage.xml --parallel --processes=auto --max-batch-size=50 --exclude-testsuite=Live

      - name: Upload coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-clover
          path: coverage.xml
          if-no-files-found: error

  sonar:
    name: SonarCloud scan
    needs: [coverage]
    # `always()` so a failed coverage job still feeds SonarCloud a baseline. Fork PRs
    # are skipped: no secrets there.
    if: |
      always() && (
        github.event_name == 'push' ||
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name == github.repository)
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout plugin
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Download coverage
        # Absent when the coverage job failed; the scan still runs, without data.
        continue-on-error: true
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: coverage-clover
          path: .

      - name: SonarCloud Scan
        # v6.0.0, as in every other plugin workflow in the house. It bundles
        # scanner CLI 7.2.0, which does not refuse a CI analysis while
        # SonarCloud's Automatic Analysis is on for the project — scanner
        # 8.1.0 (shipped with the v8 action) aborts with "You are running CI
        # analysis while Automatic Analysis is enabled", and the org's quality
        # gate has a `new_coverage` condition that Automatic Analysis cannot
        # evaluate. The organization and project key come from
        # sonar-project.properties.
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
